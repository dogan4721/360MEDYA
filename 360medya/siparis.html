<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>360 Medya - Yeni Sipariş</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        /* Platform Logoları için stiller */
        .platform-logos {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .platform-logo {
            width: 65px;
            height: 65px;
            background: #1a1a2e;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .platform-logo i {
            font-size: 28px;
            margin-bottom: 4px;
        }
        .platform-logo span {
            font-size: 10px;
            font-weight: 600;
        }
        .platform-logo:hover {
            transform: translateY(-5px);
            border-color: #6366f1;
            background: rgba(99,102,241,0.15);
        }
        .platform-logo.active {
            border-color: #6366f1;
            background: rgba(99,102,241,0.25);
            box-shadow: 0 0 15px rgba(99,102,241,0.3);
        }
        /* Instagram */
        .platform-logo[data-platform="instagram"] i { color: #E4405F; }
        /* TikTok */
        .platform-logo[data-platform="tiktok"] i { color: #00f2ea; }
        /* YouTube */
        .platform-logo[data-platform="youtube"] i { color: #FF0000; }
        /* Twitter */
        .platform-logo[data-platform="twitter"] i { color: #1DA1F2; }
        /* Facebook */
        .platform-logo[data-platform="facebook"] i { color: #1877F2; }
        
        /* Form düzeni */
        .order-form-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .price-box {
            background: rgba(99,102,241,0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        .price-box .amount {
            font-size: 2rem;
            font-weight: 800;
            color: #6366f1;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #6366f1;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            transition: 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        .loading-spinner {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
        }
        .loading-spinner i {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Servis açıklaması */
        .service-description {
            background: rgba(99,102,241,0.08);
            border-radius: 12px;
            padding: 12px 15px;
            margin-top: 10px;
            font-size: 0.85rem;
            color: #94a3b8;
            border-left: 3px solid #6366f1;
            display: none;
        }
        .service-description.show {
            display: block;
        }
        .service-description i {
            color: #6366f1;
            margin-right: 8px;
        }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <div class="logo" onclick="window.location.href='index.html'">🔥 360 Medya</div>
        
        <button class="mobile-menu-btn" onclick="window.toggleMobileMenu()">
            <i class="fas fa-bars"></i>
        </button>
        
        <div class="nav-links" id="navLinks">
            <a href="index.html">Ana Sayfa</a>
            <a href="siparis.html">Yeni Sipariş</a>
            <a href="siparislerim.html">Siparişler</a>
            <a href="bakiye.html">Bakiye Yükle</a>
            <a href="destek.html">Destek</a>
            <a href="servisler.html">Servisler</a>
            <a href="ayarlar.html">Ayarlar</a>
            <a href="api.html">API</a>
            <a href="topluluk.html">Topluluk</a>
            <a href="referans.html">Referans</a>
        </div>
        
        <div class="right-area">
            <div class="balance-box" onclick="window.location.href='bakiye.html'">
                <i class="fas fa-coins"></i> <span id="userBalance">0.00</span> ₺
            </div>
            <div id="loginButton" class="auth-btn" onclick="openAuthModal()">
                <i class="fas fa-sign-in-alt"></i> Giriş Yap
            </div>
            <div id="logoutButton" class="auth-btn logout-btn" style="display:none;" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Çıkış
            </div>
        </div>
    </div>
</header>

<main>
    <h1 class="page-title"><i class="fas fa-plus-circle"></i> Yeni Sipariş</h1>
    
    <!-- PLATFORM LOGOLARI -->
    <div class="platform-logos" id="platformLogos">
        <div class="platform-logo" data-platform="instagram" onclick="selectPlatform('instagram')">
            <i class="fab fa-instagram"></i>
            <span>Instagram</span>
        </div>
        <div class="platform-logo" data-platform="tiktok" onclick="selectPlatform('tiktok')">
            <i class="fab fa-tiktok"></i>
            <span>TikTok</span>
        </div>
        <div class="platform-logo" data-platform="youtube" onclick="selectPlatform('youtube')">
            <i class="fab fa-youtube"></i>
            <span>YouTube</span>
        </div>
        <div class="platform-logo" data-platform="twitter" onclick="selectPlatform('twitter')">
            <i class="fab fa-twitter"></i>
            <span>Twitter</span>
        </div>
        <div class="platform-logo" data-platform="facebook" onclick="selectPlatform('facebook')">
            <i class="fab fa-facebook"></i>
            <span>Facebook</span>
        </div>
    </div>
    
    <div class="order-form-container">
        <form id="orderForm">
            <div class="form-group">
                <label>Platform Seçin</label>
                <select id="category" required>
                    <option value="">Platform seçin...</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Kategori Seçin</label>
                <select id="categorySelect" required>
                    <option value="">Önce platform seçin...</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Hizmet Seçin</label>
                <select id="service" required>
                    <option value="">Önce kategori seçin...</option>
                </select>
            </div>
            
            <!-- SERVİS AÇIKLAMASI -->
            <div class="service-description" id="serviceDescription">
                <i class="fas fa-info-circle"></i> <span id="serviceDescText"></span>
            </div>
            
            <div class="form-group">
                <label>Miktar (Adet)</label>
                <input type="number" id="quantity" placeholder="Örn: 1000" min="1" required>
            </div>
            
            <div class="form-group">
                <label>Link / Kullanıcı Adı</label>
                <input type="url" id="link" placeholder="https://instagram.com/kullaniciadi" required>
            </div>
            
            <div class="price-box">
                <div class="amount" id="totalPrice">0,00</div>
                <div>₺ Toplam Tutar</div>
            </div>
            
            <button type="button" class="btn-primary" onclick="siparisVer()">Bakiyeden Sipariş Ver</button>
        </form>
    </div>
</main>

<!-- Auth Modal -->
<div id="authModal" class="auth-modal">
    <div class="auth-card">
        <div class="close-auth" onclick="closeAuthModal()">&times;</div>
        <h2 id="authTitle">Giriş Yap</h2>
        <button class="btn-google" onclick="googleLogin()"><img src="https://www.google.com/favicon.ico" style="width:18px;"> Google ile Devam Et</button>
        <div style="display:flex; align-items:center; margin:15px 0;"><hr style="flex:1;"><span>veya</span><hr style="flex:1;"></div>
        <input type="text" id="authEmail" class="auth-input" placeholder="E-posta">
        <input type="password" id="authPassword" class="auth-input" placeholder="Şifre">
        <button class="btn-primary" id="authActionBtn" onclick="authAction()">Giriş Yap</button>
        <p><a onclick="switchMode()" style="color:#6366f1; cursor:pointer;" id="switchModeBtn">Kayıt Ol</a></p>
    </div>
</div>

<script src="assets/js/main.js"></script>
<script>
    // Firebase referansları
    const db = firebase.database();
    
    // Servis verilerini tutacak değişken
    let servicesData = {};
    let currentPlatformData = null;
    let currentCategoryData = null;
    let currentServiceData = null;
    
    // Platformları ve servisleri yükle
    async function loadServices() {
        const categorySelect = document.getElementById('category');
        categorySelect.innerHTML = '<option value="">Platform seçin...</option>';
        
        try {
            const snapshot = await db.ref('services').once('value');
            const data = snapshot.val();
            
            if (data && Object.keys(data).length > 0) {
                servicesData = data;
                
                // Platformları select'e ekle
                for (const [key, value] of Object.entries(servicesData)) {
                    const option = document.createElement('option');
                    option.value = key;
                    option.text = value.name || key.charAt(0).toUpperCase() + key.slice(1);
                    categorySelect.appendChild(option);
                }
            } else {
                categorySelect.innerHTML = '<option value="">Servis bulunamadı</option>';
                console.error('Servis verisi bulunamadı');
            }
        } catch(e) {
            console.error('Servis yükleme hatası:', e);
            categorySelect.innerHTML = '<option value="">Hata oluştu</option>';
        }
    }
    
    // Platform değiştiğinde kategorileri yükle
    document.getElementById('category').addEventListener('change', function() {
        const platformKey = this.value;
        const categorySelect = document.getElementById('categorySelect');
        const serviceSelect = document.getElementById('service');
        const descDiv = document.getElementById('serviceDescription');
        
        categorySelect.innerHTML = '<option value="">Kategori seçin...</option>';
        serviceSelect.innerHTML = '<option value="">Önce kategori seçin...</option>';
        descDiv.classList.remove('show');
        document.getElementById('totalPrice').innerHTML = '0,00';
        
        if (!platformKey || !servicesData[platformKey]) {
            currentPlatformData = null;
            return;
        }
        
        currentPlatformData = servicesData[platformKey];
        const categories = currentPlatformData.categories || [];
        
        if (categories.length === 0) {
            categorySelect.innerHTML = '<option value="">Kategori bulunamadı</option>';
            return;
        }
        
        categories.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat.name;
            option.text = cat.name;
            categorySelect.appendChild(option);
        });
        
        // Logo aktifliğini güncelle
        document.querySelectorAll('.platform-logo').forEach(logo => {
            logo.classList.remove('active');
        });
        const activeLogo = document.querySelector(`.platform-logo[data-platform="${platformKey}"]`);
        if (activeLogo) activeLogo.classList.add('active');
    });
    
    // Kategori değiştiğinde hizmetleri yükle
    document.getElementById('categorySelect').addEventListener('change', function() {
        const categoryName = this.value;
        const serviceSelect = document.getElementById('service');
        const descDiv = document.getElementById('serviceDescription');
        
        serviceSelect.innerHTML = '<option value="">Hizmet seçin...</option>';
        descDiv.classList.remove('show');
        document.getElementById('totalPrice').innerHTML = '0,00';
        
        if (!currentPlatformData || !categoryName) {
            currentCategoryData = null;
            return;
        }
        
        const categories = currentPlatformData.categories || [];
        const category = categories.find(c => c.name === categoryName);
        
        if (!category) {
            serviceSelect.innerHTML = '<option value="">Hizmet bulunamadı</option>';
            return;
        }
        
        currentCategoryData = category;
        const services = category.services || [];
        
        if (services.length === 0) {
            serviceSelect.innerHTML = '<option value="">Hizmet bulunamadı</option>';
            return;
        }
        
        services.forEach(service => {
            const option = document.createElement('option');
            option.value = service.id;
            option.text = `${service.name} (Min: ${service.min.toLocaleString()})`;
            option.dataset.price = service.price;
            option.dataset.min = service.min;
            option.dataset.max = service.max;
            option.dataset.desc = service.desc || "Hızlı teslimat, kaliteli hizmet. 7/24 destek.";
            serviceSelect.appendChild(option);
        });
    });
    
    // Hizmet değiştiğinde açıklamayı göster ve fiyat hesapla
    document.getElementById('service').addEventListener('change', function() {
        const selectedOption = this.selectedOptions[0];
        const descDiv = document.getElementById('serviceDescription');
        const descText = document.getElementById('serviceDescText');
        
        if (selectedOption && selectedOption.dataset.desc) {
            descText.innerText = selectedOption.dataset.desc;
            descDiv.classList.add('show');
        } else {
            descDiv.classList.remove('show');
        }
        
        if (selectedOption && selectedOption.dataset.price) {
            currentServiceData = {
                price: parseFloat(selectedOption.dataset.price),
                min: parseInt(selectedOption.dataset.min),
                max: parseInt(selectedOption.dataset.max)
            };
        } else {
            currentServiceData = null;
        }
        calculate();
    });
    
    document.getElementById('quantity').addEventListener('input', calculate);
    
    function calculate() {
        const qty = parseInt(document.getElementById('quantity').value) || 0;
        
        if (currentServiceData) {
            if (qty > 0 && qty < currentServiceData.min) {
                document.getElementById('quantity').style.borderColor = '#ef4444';
            } else {
                document.getElementById('quantity').style.borderColor = 'rgba(255,255,255,0.1)';
            }
            const total = (currentServiceData.price * qty) / 1000;
            document.getElementById('totalPrice').innerHTML = total.toFixed(2);
        } else {
            document.getElementById('totalPrice').innerHTML = '0,00';
        }
    }
    
    // Platform logosu ile select senkronizasyonu
    function selectPlatform(platform) {
        const categorySelect = document.getElementById('category');
        let optionExists = false;
        for (let i = 0; i < categorySelect.options.length; i++) {
            if (categorySelect.options[i].value === platform) {
                optionExists = true;
                break;
            }
        }
        
        if (optionExists) {
            categorySelect.value = platform;
            const event = new Event('change');
            categorySelect.dispatchEvent(event);
        } else {
            alert(`${platform} platformu henüz eklenmemiş. Admin panelinden ekleyebilirsiniz.`);
        }
    }
    
    // Kullanıcı bakiyesini güncelle
    async function updateUserBalance() {
        if (!currentUser) return;
        try {
            const snapshot = await db.ref('users').once('value');
            const users = snapshot.val() || {};
            for (let key in users) {
                if (users[key].email === currentUser.email) {
                    currentUser.balance = users[key].balance || 0;
                    document.getElementById('userBalance').innerText = currentUser.balance.toFixed(2);
                    break;
                }
            }
        } catch(e) { console.error(e); }
    }
    
    // Sipariş verme
    window.siparisVer = async function() {
        if (!currentUser) { 
            alert('Giriş yapın'); 
            openAuthModal(); 
            return; 
        }
        
        const platform = document.getElementById('category').value;
        const categoryName = document.getElementById('categorySelect').value;
        const serviceId = document.getElementById('service').value;
        const qty = parseInt(document.getElementById('quantity').value);
        const link = document.getElementById('link').value.trim();
        const total = parseFloat(document.getElementById('totalPrice').innerHTML);
        
        if (!platform || !categoryName || !serviceId || !qty || !link) { 
            alert('Tüm alanları doldurun'); 
            return; 
        }
        
        if (!currentServiceData) {
            alert('Lütfen geçerli bir hizmet seçin');
            return;
        }
        
        if (qty < currentServiceData.min) {
            alert(`Minimum sipariş miktarı: ${currentServiceData.min.toLocaleString()}`);
            return;
        }
        
        if (currentServiceData.max && qty > currentServiceData.max) {
            alert(`Maximum sipariş miktarı: ${currentServiceData.max.toLocaleString()}`);
            return;
        }
        
        if (!link.startsWith('http')) {
            alert('Geçerli bir link girin (https://... ile başlamalı)');
            return;
        }
        
        await updateUserBalance();
        
        if (currentUser.balance < total) { 
            alert(`Yetersiz bakiye! Bakiyeniz: ${currentUser.balance.toFixed(2)} ₺, İhtiyacınız: ${total.toFixed(2)} ₺`);
            return; 
        }
        
        currentUser.balance -= total;
        
        const usersSnap = await db.ref('users').once('value');
        const users = usersSnap.val() || {};
        let userKey = null;
        for (let key in users) {
            if (users[key].email === currentUser.email) {
                userKey = key;
                break;
            }
        }
        
        if (userKey) {
            await db.ref(`users/${userKey}/balance`).set(currentUser.balance);
        }
        
        let serviceName = '';
        const services = currentCategoryData.services || [];
        const foundService = services.find(s => s.id == serviceId);
        if (foundService) serviceName = foundService.name;
        
        const orderCode = 'ORD-' + Date.now() + '-' + Math.random().toString(36).substring(2,8).toUpperCase();
        
        const newOrder = {
            code: orderCode,
            platform: platform,
            category: categoryName,
            serviceId: serviceId,
            service: serviceName,
            quantity: qty,
            price: total.toFixed(2),
            link: link,
            email: currentUser.email,
            name: currentUser.displayName || currentUser.email.split('@')[0],
            status: 'Beklemede',
            date: new Date().toISOString(),
            remaining: qty
        };
        
        await db.ref('orders').push(newOrder);
        
        localStorage.setItem('360_session', JSON.stringify({ 
            email: currentUser.email, 
            balance: currentUser.balance,
            name: currentUser.displayName
        }));
        
        document.getElementById('userBalance').innerText = currentUser.balance.toFixed(2);
        
        alert(`✅ Sipariş oluşturuldu!\n📌 Sipariş Kodu: ${orderCode}\n💰 Toplam: ${total.toFixed(2)} ₺\n📝 Sipariş durumunu siparişlerim sayfasından takip edebilirsiniz.`);
        
        document.getElementById('category').value = '';
        document.getElementById('categorySelect').innerHTML = '<option value="">Önce platform seçin...</option>';
        document.getElementById('service').innerHTML = '<option value="">Önce kategori seçin...</option>';
        document.getElementById('quantity').value = '';
        document.getElementById('link').value = '';
        document.getElementById('totalPrice').innerHTML = '0,00';
        document.getElementById('serviceDescription').classList.remove('show');
        
        currentPlatformData = null;
        currentCategoryData = null;
        currentServiceData = null;
        
        document.querySelectorAll('.platform-logo').forEach(logo => {
            logo.classList.remove('active');
        });
    };
    
    document.addEventListener('DOMContentLoaded', async function() {
        await loadServices();
        if (currentUser) {
            await updateUserBalance();
        }
    });
</script>
</body>
</html>
