<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>360 Medya - Siparişlerim</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="shortcut icon" href="favicon.ico"><link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        /* Filtre Butonları */
        .filter-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }
        .filter-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 8px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .filter-btn:hover {
            background: rgba(99,102,241,0.1);
            color: #6366f1;
        }
        .filter-btn.active {
            background: #6366f1;
            color: white;
        }
        
        /* Sipariş Kartı */
        .order-card {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .order-card:hover {
            transform: translateY(-3px);
            border-color: rgba(99,102,241,0.3);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .order-code {
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: #6366f1;
        }
        .order-status {
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .status-pending { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .status-processing { background: rgba(99,102,241,0.2); color: #6366f1; }
        .status-completed { background: rgba(34,197,94,0.2); color: #22c55e; }
        .status-cancelled { background: rgba(239,68,68,0.2); color: #ef4444; }
        
        .order-service {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .order-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin: 15px 0;
            padding: 12px;
            background: #0f0f1a;
            border-radius: 16px;
        }
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        .detail-label {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .detail-value {
            font-size: 0.9rem;
            font-weight: 500;
        }
        .detail-value a {
            color: #6366f1;
            text-decoration: none;
            word-break: break-all;
        }
        .detail-value a:hover {
            text-decoration: underline;
        }
        
        /* Progress Bar */
        .progress-section {
            margin: 15px 0;
        }
        .progress-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .progress-bar {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #6366f1, #22c55e);
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        
        /* İstatistikler */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .stat-box {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 18px;
            text-align: center;
        }
        .stat-label {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #6366f1;
        }
        
        /* Sorgulama Bölümü */
        .query-section {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .query-input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .query-input-group input {
            flex: 1;
            padding: 14px 18px;
            background: #0f0f1a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-family: monospace;
        }
        .query-result {
            margin-top: 20px;
            padding: 20px;
            background: #0f0f1a;
            border-radius: 16px;
            display: none;
        }
        .query-result.active {
            display: block;
        }
        
        @media (max-width: 768px) {
            .order-details {
                grid-template-columns: 1fr 1fr;
            }
            .filter-btn {
                padding: 6px 14px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <div class="logo" onclick="window.location.href='index.html'">🔥 360 Medya</div>
        
        <button class="mobile-menu-btn" onclick="window.toggleMobileMenu()">
            <i class="fas fa-bars"></i>
        </button>
        
        <div class="nav-links" id="navLinks">
            <a href="index.html">Ana Sayfa</a>
            <a href="siparis.html">Yeni Sipariş</a>
            <a href="siparislerim.html">Siparişler</a>
            <a href="bakiye.html">Bakiye Yükle</a>
            <a href="destek.html">Destek</a>
            <a href="servisler.html">Servisler</a>
            <a href="ayarlar.html">Ayarlar</a>
            <a href="api.html">API</a>
            <a href="topluluk.html">Topluluk</a>
            <a href="referans.html">Referans</a>
        </div>
        
        <div class="right-area">
            <div class="balance-box" onclick="window.location.href='bakiye.html'">
                <i class="fas fa-coins"></i> <span id="userBalance">0.00</span> ₺
            </div>
            <div id="loginButton" class="auth-btn" onclick="openAuthModal()">
                <i class="fas fa-sign-in-alt"></i> Giriş Yap
            </div>
            <div id="logoutButton" class="auth-btn logout-btn" style="display:none;" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Çıkış
            </div>
        </div>
    </div>
</header>

<main>
    <h1 class="page-title"><i class="fas fa-list-ul"></i> Siparişlerim</h1>
    
    <!-- Sipariş Sorgulama Bölümü -->
    <div class="query-section">
        <h3 style="margin-bottom: 15px;"><i class="fas fa-search"></i> Sipariş Sorgula</h3>
        <div class="query-input-group">
            <input type="text" id="orderQueryInput" placeholder="Sipariş kodunuzu girin (örn: #ABC12345)" onkeypress="if(event.key==='Enter') searchOrderByCode()">
            <button class="btn-primary" onclick="searchOrderByCode()" style="width: auto; padding: 12px 25px;"><i class="fas fa-search"></i> Sorgula</button>
        </div>
        <div id="queryResult" class="query-result"></div>
    </div>
    
    <!-- Filtre Butonları -->
    <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">📋 Tümü</button>
        <button class="filter-btn" data-filter="beklemede">⏳ Bekliyor</button>
        <button class="filter-btn" data-filter="islemde">🔄 İşleniyor</button>
        <button class="filter-btn" data-filter="tamamlandi">✅ Tamamlandı</button>
        <button class="filter-btn" data-filter="iptal">❌ İptal</button>
    </div>
    
    <!-- Sipariş Listesi -->
    <div id="ordersList"></div>
    
    <!-- İstatistikler -->
    <div class="stats-row" id="statsRow" style="display: none;">
        <div class="stat-box">
            <div class="stat-label">📦 Toplam Sipariş</div>
            <div class="stat-value" id="totalOrders">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">💰 Toplam Harcama</div>
            <div class="stat-value" id="totalSpent">0 ₺</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">📊 Ortalama Sipariş</div>
            <div class="stat-value" id="avgOrder">0 ₺</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">📈 Başarı Oranı</div>
            <div class="stat-value" id="successRate">0%</div>
        </div>
    </div>
</main>

<!-- Auth Modal -->
<div id="authModal" class="auth-modal">
    <div class="auth-card">
        <div class="close-auth" onclick="closeAuthModal()">&times;</div>
        <h2 id="authTitle">Giriş Yap</h2>
        <button class="btn-google" onclick="googleLogin()"><img src="https://www.google.com/favicon.ico" style="width:18px;"> Google ile Devam Et</button>
        <div style="display:flex; align-items:center; margin:15px 0;"><hr style="flex:1;"><span>veya</span><hr style="flex:1;"></div>
        <input type="text" id="authEmail" class="auth-input" placeholder="E-posta">
        <input type="password" id="authPassword" class="auth-input" placeholder="Şifre">
        <button class="btn-primary" id="authActionBtn" onclick="authAction()">Giriş Yap</button>
        <p><a onclick="switchMode()" style="color:#6366f1; cursor:pointer;">Kayıt Ol</a></p>
    </div>
</div>

<script src="assets/js/main.js"></script>
<script>
    let allOrders = [];
    let currentFilter = 'all';
    let userEmail = null;
    
    // Filtre butonları
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            renderOrders();
        });
    });
    
    // Firebase'den siparişleri dinle (canlı güncelleme)
    function listenOrders() {
        if (!currentUser) return;
        userEmail = currentUser.email;
        
        database.ref('orders').on('value', (snapshot) => {
            const orders = snapshot.val() ? Object.values(snapshot.val()) : [];
            allOrders = orders.filter(o => o.email === userEmail);
            renderOrders();
            updateStats();
        });
    }
    
    // Siparişleri göster
    function renderOrders() {
        const container = document.getElementById('ordersList');
        
        if (!currentUser) {
            container.innerHTML = `
                <div class="order-card" style="text-align: center;">
                    <i class="fas fa-lock" style="font-size: 3rem; opacity: 0.5; margin-bottom: 15px;"></i>
                    <p>Siparişlerinizi görmek için lütfen giriş yapın</p>
                    <button class="btn-primary" onclick="openAuthModal()" style="margin-top: 15px; width: auto; padding: 10px 25px;">Giriş Yap</button>
                </div>
            `;
            document.getElementById('statsRow').style.display = 'none';
            return;
        }
        
        let filtered = allOrders;
        if (currentFilter === 'beklemede') filtered = allOrders.filter(o => o.status === 'Beklemede');
        else if (currentFilter === 'islemde') filtered = allOrders.filter(o => o.status === 'İşlemde');
        else if (currentFilter === 'tamamlandi') filtered = allOrders.filter(o => o.status === 'Tamamlandı');
        else if (currentFilter === 'iptal') filtered = allOrders.filter(o => o.status === 'İptal');
        
        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="order-card" style="text-align: center;">
                    <i class="fas fa-inbox" style="font-size: 3rem; opacity: 0.5; margin-bottom: 15px;"></i>
                    <p>Henüz siparişiniz bulunmuyor</p>
                    <a href="siparis.html" class="btn-primary" style="display: inline-block; margin-top: 15px; text-decoration: none;">Yeni Sipariş Oluştur</a>
                </div>
            `;
            return;
        }
        
        container.innerHTML = filtered.map(order => {
            const remaining = order.remaining || order.quantity || 0;
            const total = order.quantity || 0;
            const completed = total - remaining;
            const percent = total > 0 ? (completed / total * 100) : 0;
            const statusClass = getStatusClass(order.status);
            const statusText = getStatusText(order.status);
            
            return `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-code"><i class="fas fa-tag"></i> ${order.code}</span>
                        <span class="order-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="order-service">
                        <i class="fas fa-cogs"></i> ${order.service || '-'}
                    </div>
                    <div class="order-details">
                        <div class="detail-item">
                            <span class="detail-label">📅 Sipariş Tarihi</span>
                            <span class="detail-value">${formatDate(order.date)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">🔗 Link</span>
                            <span class="detail-value"><a href="${order.link}" target="_blank">${shortenLink(order.link)}</a></span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">📦 Miktar</span>
                            <span class="detail-value">${total} adet</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">💰 Tutar</span>
                            <span class="detail-value" style="color: #22c55e;">${order.price || '0 ₺'}</span>
                        </div>
                    </div>
                    <div class="progress-section">
                        <div class="progress-stats">
                            <span>✅ Tamamlanan: ${completed}</span>
                            <span>⏳ Kalan: ${remaining}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${percent}%;"></div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }
    
    // Sipariş kodu ile sorgulama
    async function searchOrderByCode() {
        const code = document.getElementById('orderQueryInput').value.trim().toUpperCase();
        if (!code) {
            alert('Lütfen sipariş kodunuzu girin!');
            return;
        }
        
        const snapshot = await database.ref('orders').once('value');
        const orders = snapshot.val() ? Object.values(snapshot.val()) : [];
        const order = orders.find(o => o.code === code);
        const resultDiv = document.getElementById('queryResult');
        
        if (!order) {
            resultDiv.innerHTML = `
                <div style="text-align: center; color: #ef4444;">
                    <i class="fas fa-exclamation-circle" style="font-size: 2rem;"></i>
                    <p>Sipariş bulunamadı. Lütfen kodu kontrol edin.</p>
                </div>
            `;
            resultDiv.classList.add('active');
            return;
        }
        
        const remaining = order.remaining || order.quantity || 0;
        const total = order.quantity || 0;
        const completed = total - remaining;
        const percent = total > 0 ? (completed / total * 100) : 0;
        const statusClass = getStatusClass(order.status);
        const statusText = getStatusText(order.status);
        
        resultDiv.innerHTML = `
            <div class="order-card" style="margin-bottom: 0;">
                <div class="order-header">
                    <span class="order-code"><i class="fas fa-tag"></i> ${order.code}</span>
                    <span class="order-status ${statusClass}">${statusText}</span>
                </div>
                <div class="order-service">
                    <i class="fas fa-cogs"></i> ${order.service || '-'}
                </div>
                <div class="order-details">
                    <div class="detail-item">
                        <span class="detail-label">📅 Sipariş Tarihi</span>
                        <span class="detail-value">${formatDate(order.date)}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">🔗 Link</span>
                        <span class="detail-value"><a href="${order.link}" target="_blank">${shortenLink(order.link)}</a></span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">📦 Miktar</span>
                        <span class="detail-value">${total} adet</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">💰 Tutar</span>
                        <span class="detail-value" style="color: #22c55e;">${order.price || '0 ₺'}</span>
                    </div>
                </div>
                <div class="progress-section">
                    <div class="progress-stats">
                        <span>✅ Tamamlanan: ${completed}</span>
                        <span>⏳ Kalan: ${remaining}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${percent}%;"></div>
                    </div>
                </div>
            </div>
        `;
        resultDiv.classList.add('active');
        
        // 5 saniye sonra otomatik kapat
        setTimeout(() => {
            resultDiv.classList.remove('active');
        }, 10000);
    }
    
    // İstatistikleri güncelle
    function updateStats() {
        if (!currentUser || allOrders.length === 0) {
            document.getElementById('statsRow').style.display = 'none';
            return;
        }
        
        document.getElementById('statsRow').style.display = 'grid';
        
        const total = allOrders.length;
        let totalSpent = 0;
        let completedCount = 0;
        
        allOrders.forEach(order => {
            const price = parseFloat(order.price) || 0;
            totalSpent += price;
            if (order.status === 'Tamamlandı') completedCount++;
        });
        
        const avgOrder = total > 0 ? totalSpent / total : 0;
        const successRate = total > 0 ? (completedCount / total * 100).toFixed(1) : 0;
        
        document.getElementById('totalOrders').innerHTML = total;
        document.getElementById('totalSpent').innerHTML = `${totalSpent.toFixed(2)} ₺`;
        document.getElementById('avgOrder').innerHTML = `${avgOrder.toFixed(2)} ₺`;
        document.getElementById('successRate').innerHTML = `${successRate}%`;
    }
    
    // Yardımcı fonksiyonlar
    function getStatusClass(status) {
        if (status === 'Beklemede') return 'status-pending';
        if (status === 'İşlemde') return 'status-processing';
        if (status === 'Tamamlandı') return 'status-completed';
        if (status === 'İptal') return 'status-cancelled';
        return 'status-pending';
    }
    
    function getStatusText(status) {
        if (status === 'Beklemede') return 'Bekliyor';
        if (status === 'İşlemde') return 'İşleniyor';
        if (status === 'Tamamlandı') return 'Tamamlandı';
        if (status === 'İptal') return 'İptal';
        return status || 'Bekliyor';
    }
    
    function formatDate(dateStr) {
        if (!dateStr) return '-';
        const date = new Date(dateStr);
        return `${date.getDate()}/${date.getMonth()+1}/${date.getFullYear()} ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
    }
    
    function shortenLink(url) {
        if (!url) return '-';
        if (url.length > 40) return url.substring(0, 37) + '...';
        return url;
    }
    
    // Oturum değişince siparişleri yenile
    const originalUpdateBalanceUI = updateBalanceUI;
    window.updateBalanceUI = async function() {
        if (originalUpdateBalanceUI) await originalUpdateBalanceUI();
        if (currentUser) {
            userEmail = currentUser.email;
            listenOrders();
        }
    };
    
    // Sayfa yüklendiğinde
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            if (currentUser) {
                userEmail = currentUser.email;
                listenOrders();
            } else {
                document.getElementById('ordersList').innerHTML = `
                    <div class="order-card" style="text-align: center;">
                        <i class="fas fa-lock" style="font-size: 3rem; opacity: 0.5; margin-bottom: 15px;"></i>
                        <p>Siparişlerinizi görmek için lütfen giriş yapın</p>
                        <button class="btn-primary" onclick="openAuthModal()" style="margin-top: 15px; width: auto; padding: 10px 25px;">Giriş Yap</button>
                    </div>
                `;
                document.getElementById('statsRow').style.display = 'none';
            }
        }, 100);
    });
</script>
</body>
</html>
