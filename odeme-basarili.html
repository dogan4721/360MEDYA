<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ödeme Başarılı - 360 Medya</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body style="background:#0a0a12; color:white; text-align:center; padding:50px; font-family:Arial;">
    <h1 style="color:#22c55e;">✅ Ödeme Başarılı!</h1>
    <p id="status">Bakiyeniz yükleniyor...</p>
    <a href="/" style="color:#6366f1;">Ana Sayfaya Dön</a>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCtSpmTP9_i-s2ZL2rC1ozVx6uPu68kVCs",
            authDomain: "smm-panel-f2947.firebaseapp.com",
            databaseURL: "https://smm-panel-f2947-default-rtdb.firebaseio.com",
            projectId: "smm-panel-f2947",
            storageBucket: "smm-panel-f2947.firebasestorage.app",
            messagingSenderId: "758065772278",
            appId: "1:758065772278:web:a94d37b0ff892583e81ed7"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('order_id');
        
        if (orderId) {
            db.ref('temp_payments/' + orderId).once('value').then(snap => {
                const order = snap.val();
                if (order && order.status === 'pending') {
                    db.ref('users').once('value').then(usersSnap => {
                        const users = usersSnap.val();
                        for (let [k, v] of Object.entries(users || {})) {
                            if (v.email === order.userEmail) {
                                const yeniBakiye = (v.balance || 0) + order.amount;
                                db.ref(`users/${k}/balance`).set(yeniBakiye);
                                db.ref(`temp_payments/${orderId}/status`).set('completed');
                                document.getElementById('status').innerHTML = `✅ ${order.amount} TL bakiyenize yüklendi!`;
                                break;
                            }
                        }
                    });
                }
            });
        }
    </script>
</body>
</html>
