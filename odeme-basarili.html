<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ödeme Başarılı - 360 Medya</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        body {
            background: #0a0a12;
            color: #e2e8f0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .success-card {
            background: #1a1a2e;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(99,102,241,0.3);
        }
        .success-icon {
            font-size: 80px;
            color: #22c55e;
            margin-bottom: 20px;
        }
        h1 {
            color: #22c55e;
            margin-bottom: 10px;
        }
        .info-box {
            background: #0f0f1a;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 15px;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: #6366f1;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1>✅ Ödeme Başarılı!</h1>
        <p style="color: #94a3b8;">Ödemeniz alındı. Lütfen aşağıdaki butona tıklayarak onaylayın.</p>
        
        <div id="orderInfo" class="info-box">
            <div class="info-row">
                <span>Sipariş ID:</span>
                <strong id="orderId">-</strong>
            </div>
            <div class="info-row">
                <span>Tutar:</span>
                <strong id="amount" style="color: #22c55e;">-</strong>
            </div>
            <div class="info-row">
                <span>İşlem Tarihi:</span>
                <strong id="date">-</strong>
            </div>
        </div>
        
        <button class="btn-primary" id="confirmBtn" onclick="confirmPayment()">
            <i class="fas fa-check"></i> Ödeme Yaptım, Onayla
        </button>
        <button class="btn-secondary" onclick="window.location.href='index.html'">
            <i class="fas fa-home"></i> Ana Sayfaya Dön
        </button>
        
        <p id="statusMessage" style="margin-top: 15px; font-size: 0.8rem; color: #f59e0b;"></p>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCtSpmTP9_i-s2ZL2rC1ozVx6uPu68kVCs",
            authDomain: "smm-panel-f2947.firebaseapp.com",
            databaseURL: "https://smm-panel-f2947-default-rtdb.firebaseio.com",
            projectId: "smm-panel-f2947",
            storageBucket: "smm-panel-f2947.firebasestorage.app",
            messagingSenderId: "758065772278",
            appId: "1:758065772278:web:a94d37b0ff892583e81ed7"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();
        
        let paymentRequest = null;
        let currentUser = null;
        
        // URL'den parametreleri al
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id');
        const amount = urlParams.get('amount');
        
        document.getElementById('orderId').innerText = orderId || 'BELİRSİZ';
        document.getElementById('amount').innerText = amount ? `${amount} TL` : 'BELİRSİZ';
        document.getElementById('date').innerText = new Date().toLocaleString('tr-TR');
        
        // Kullanıcı oturumunu kontrol et
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                
                // Daha önce bu sipariş için kayıt var mı kontrol et
                const snapshot = await database.ref('payment_requests').once('value');
                const requests = snapshot.val();
                
                if (requests) {
                    const existingRequest = Object.entries(requests).find(([id, req]) => req.orderId === orderId);
                    if (existingRequest) {
                        paymentRequest = { id: existingRequest[0], ...existingRequest[1] };
                        if (paymentRequest.status === 'confirmed') {
                            document.getElementById('confirmBtn').disabled = true;
                            document.getElementById('confirmBtn').innerHTML = '<i class="fas fa-check"></i> Zaten Onaylandı';
                            document.getElementById('statusMessage').innerHTML = 'Bu ödeme zaten onaylanmış.';
                        }
                    }
                }
            } else {
                document.getElementById('confirmBtn').disabled = true;
                document.getElementById('confirmBtn').innerHTML = '<i class="fas fa-lock"></i> Önce Giriş Yapın';
                document.getElementById('statusMessage').innerHTML = 'Ödemeyi onaylamak için lütfen giriş yapın.';
                document.getElementById('confirmBtn').onclick = () => {
                    window.location.href = 'index.html';
                };
            }
        });
        
        // Ödemeyi onayla
        async function confirmPayment() {
            if (!currentUser) {
                alert('Lütfen önce giriş yapın!');
                window.location.href = 'index.html';
                return;
            }
            
            const btn = document.getElementById('confirmBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loading"></span> İşleniyor...';
            btn.disabled = true;
            
            try {
                // Önce payment_requests'de kayıtlı mı kontrol et
                const snapshot = await database.ref('payment_requests').once('value');
                let requests = snapshot.val() || {};
                
                let existingId = null;
                let existingRequest = null;
                
                for (const [id, req] of Object.entries(requests)) {
                    if (req.orderId === orderId || (req.amount == amount && req.userEmail === currentUser.email && req.status === 'pending')) {
                        existingId = id;
                        existingRequest = req;
                        break;
                    }
                }
                
                if (existingId) {
                    // Zaten kayıtlı, sadece durumu güncelle
                    await database.ref(`payment_requests/${existingId}/status`).set('confirmed');
                    await database.ref(`payment_requests/${existingId}/confirmedAt`).set(new Date().toISOString());
                } else {
                    // Yeni kayıt oluştur
                    const newRequest = {
                        orderId: orderId,
                        userEmail: currentUser.email,
                        userName: currentUser.displayName || currentUser.email.split('@')[0],
                        amount: parseFloat(amount) || 0,
                        date: new Date().toISOString(),
                        status: 'confirmed',
                        source: 'shopier_return'
                    };
                    
                    await database.ref('payment_requests').push(newRequest);
                }
                
                // Ayrıca balance_requests'e de ekle (admin panelinde görünsün)
                const balanceSnap = await database.ref('balance_requests').once('value');
                let balanceReqs = balanceSnap.val() ? Object.values(balanceSnap.val()) : [];
                const requestCode = 'BL-' + Date.now() + '-' + Math.random().toString(36).substring(2,8).toUpperCase();
                
                balanceReqs.push({
                    code: requestCode,
                    userEmail: currentUser.email,
                    userName: currentUser.displayName || currentUser.email.split('@')[0],
                    amount: parseFloat(amount) || 0,
                    date: new Date().toISOString(),
                    status: 'pending',
                    source: 'shopier'
                });
                
                await database.ref('balance_requests').set(balanceReqs);
                
                document.getElementById('statusMessage').innerHTML = '✅ Ödeme onayınız alındı! Admin onayından sonra bakiyeniz yüklenecektir.';
                btn.innerHTML = '<i class="fas fa-check"></i> Onay Gönderildi';
                btn.disabled = true;
                
                setTimeout(() => {
                    window.location.href = 'bakiye.html';
                }, 3000);
                
            } catch (error) {
                console.error('Onay hatası:', error);
                document.getElementById('statusMessage').innerHTML = '❌ Bir hata oluştu, lütfen tekrar deneyin.';
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
