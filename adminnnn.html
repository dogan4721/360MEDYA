<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Medya | Yönetim Paneli</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #09090b; --card: #111114; --primary: #6366f1;
            --text: #fafafa; --muted: #a1a1aa; --border: rgba(255, 255, 255, 0.08);
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 260px; background: var(--card); border-right: 1px solid var(--border); padding: 2rem 1.2rem; position: fixed; height: 100vh; }
        .sidebar h2 { color: var(--primary); font-weight: 800; margin-bottom: 2.5rem; text-align: center; }
        .nav-link { padding: 1rem; border-radius: 12px; color: var(--muted); display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.3s; margin-bottom: 0.5rem; }
        .nav-link:hover, .nav-link.active { background: rgba(99, 102, 241, 0.1); color: var(--primary); }

        /* Main Content */
        .main { flex: 1; margin-left: 260px; padding: 2.5rem; width: calc(100% - 260px); }
        .tab-content { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Table Design */
        .table-container { background: var(--card); border-radius: 20px; border: 1px solid var(--border); overflow-x: auto; margin-top: 1rem; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { background: rgba(255,255,255,0.02); padding: 1.2rem; text-align: left; font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
        td { padding: 1.2rem; border-top: 1px solid var(--border); font-size: 0.85rem; vertical-align: middle; }

        /* Inputs & Badges */
        .remains-input { width: 80px; background: #000; border: 1px solid var(--border); color: var(--success); padding: 6px; border-radius: 6px; text-align: center; font-weight: bold; }
        .badge { padding: 6px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 700; }
        .badge-pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .badge-completed { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .badge-canceled { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

        .btn { padding: 8px 14px; border-radius: 10px; border: none; cursor: pointer; font-size: 0.75rem; font-weight: 600; transition: 0.2s; }
        .btn-success { background: var(--primary); color: white; margin-right: 5px; }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }

        #loginOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div style="background: var(--card); padding: 3rem; border-radius: 24px; border: 1px solid var(--border); text-align: center; width: 350px;">
        <i class="fas fa-lock fa-3x" style="color:var(--primary); margin-bottom:1rem;"></i>
        <h2 style="margin-bottom:1.5rem;">Yönetici Girişi</h2>
        <input type="password" id="passInput" placeholder="Sistem Şifresi" style="width:100%; padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:10px; color:white; margin-bottom:1rem; outline:none;">
        <button class="btn btn-success" style="width:100%; padding:12px;" onclick="doLogin()">Giriş Yap</button>
    </div>
</div>

<aside class="sidebar">
    <h2>360 MEDYA</h2>
    <div class="nav-link active" onclick="tab('orders', this)"><i class="fas fa-shopping-basket"></i> Siparişler</div>
    <div class="nav-link" onclick="tab('payments', this)"><i class="fas fa-wallet"></i> Bakiye Talepleri</div>
    <div class="nav-link" onclick="tab('users', this)"><i class="fas fa-users-cog"></i> Kullanıcılar</div>
    <div class="nav-link" style="margin-top:auto; color:var(--danger)" onclick="location.reload()"><i class="fas fa-sign-out-alt"></i> Çıkış</div>
</aside>

<main class="main">
    <div id="ordersTab" class="tab-content">
        <h1>Sipariş Yönetimi</h1>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Sipariş No</th>
                        <th>Müşteri (Ad/Email)</th>
                        <th>Tutar</th>
                        <th>Link</th>
                        <th>Tarih</th>
                        <th>Durum</th>
                        <th>Kalan Miktar</th>
                        <th>İşlemler</th>
                    </tr>
                </thead>
                <tbody id="ordersList"></tbody>
            </table>
        </div>
    </div>

    <div id="paymentsTab" class="tab-content hidden">
        <h1>Bakiye Yükleme Onayı</h1>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Kullanıcı Email</th>
                        <th>Miktar</th>
                        <th>Ödeme Kodu</th>
                        <th>Tarih</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="paymentsList"></tbody>
            </table>
        </div>
    </div>

    <div id="usersTab" class="tab-content hidden">
        <h1>Kayıtlı Üyeler</h1>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Ad Soyad</th>
                        <th>E-posta</th>
                        <th>Mevcut Bakiye</th>
                        <th>Şifre</th>
                    </tr>
                </thead>
                <tbody id="usersList"></tbody>
            </table>
        </div>
    </div>
</main>

<script>
    // --- FIREBASE AYARLARI ---
    const firebaseConfig = {
        apiKey: "AIzaSyBygrzMYNAcYhEoKjhREzn4JPIemW6wxoc",
        authDomain: "smmpanel-1bd3b.firebaseapp.com",
        databaseURL: "https://smmpanel-1bd3b-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "smmpanel-1bd3b",
        storageBucket: "smmpanel-1bd3b.firebasestorage.app",
        messagingSenderId: "276335468127",
        appId: "1:276335468127:web:aa1c01275f5a86414805ea"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function doLogin() {
        if(document.getElementById('passInput').value === "472131") {
            document.getElementById('loginOverlay').classList.add('hidden');
            initPanel();
        } else { alert("Hatalı Yetki Şifresi!"); }
    }

    function tab(name, el) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.getElementById(name + 'Tab').classList.remove('hidden');
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        el.classList.add('active');
    }

    function initPanel() {
        // Canlı Veri Akışı
        db.ref().on('value', snapshot => {
            const data = snapshot.val() || {};
            
            // 1. SIPARISLERI YUKLE
            const oList = document.getElementById('ordersList');
            oList.innerHTML = "";
            if(data.orders) {
                Object.entries(data.orders).reverse().forEach(([key, o]) => {
                    oList.innerHTML += `
                        <tr>
                            <td><b style="color:var(--primary)">#${o.code}</b></td>
                            <td>${o.name || o.email}</td>
                            <td>₺${o.price}</td>
                            <td><a href="${o.link}" target="_blank" style="color:var(--primary); text-decoration:none;">GİT <i class="fas fa-external-link-alt"></i></a></td>
                            <td>${o.date || '-'}</td>
                            <td><span class="badge badge-${o.status === 'Tamamlandı' ? 'completed' : (o.status === 'İptal' ? 'canceled' : 'pending')}">${o.status}</span></td>
                            <td>
                                <input type="number" class="remains-input" value="${o.remains || 0}" 
                                       onchange="saveRemains('${key}', this.value)">
                            </td>
                            <td>
                                <button class="btn btn-success" onclick="setStatus('${key}', 'Tamamlandı')">Tamamla</button>
                                <button class="btn btn-danger" onclick="setStatus('${key}', 'İptal')">İptal</button>
                            </td>
                        </tr>`;
                });
            }

            // 2. BAKIYE TALEPLERINI YUKLE
            const pList = document.getElementById('paymentsList');
            pList.innerHTML = "";
            if(data.balance_requests) {
                Object.entries(data.balance_requests).forEach(([id, r]) => {
                    pList.innerHTML += `
                        <tr>
                            <td>${r.userEmail}</td>
                            <td>₺${r.amount}</td>
                            <td><code>${r.code}</code></td>
                            <td>${new Date(r.date).toLocaleDateString()}</td>
                            <td><button class="btn btn-success" onclick="confirmPayment('${id}', '${r.userEmail}', ${r.amount})">Onayla</button></td>
                        </tr>`;
                });
            }

            // 3. KULLANICILARI YUKLE
            const uList = document.getElementById('usersList');
            uList.innerHTML = "";
            if(data.users) {
                Object.values(data.users).forEach(u => {
                    uList.innerHTML += `
                        <tr>
                            <td>${u.name || '-'}</td>
                            <td>${u.email}</td>
                            <td style="color:var(--success); font-weight:700;">₺${(u.balance || 0).toFixed(2)}</td>
                            <td><code>${u.password}</code></td>
                        </tr>`;
                });
            }
        });
    }

    // FONKSIYONLAR
    function setStatus(key, status) {
        db.ref(`orders/${key}/status`).set(status);
    }

    function saveRemains(key, val) {
        db.ref(`orders/${key}/remains`).set(val);
    }

    async function confirmPayment(reqId, email, amount) {
        const userSnap = await db.ref('users').once('value');
        const userKey = Object.keys(userSnap.val()).find(k => userSnap.val()[k].email === email);
        if(userKey) {
            const current = userSnap.val()[userKey].balance || 0;
            await db.ref(`users/${userKey}/balance`).set(current + parseFloat(amount));
            await db.ref(`balance_requests/${reqId}`).remove();
            alert("Bakiye başarıyla eklendi.");
        }
    }
</script>
</body>
</html>
