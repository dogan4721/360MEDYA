<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>360 Medya - Destek</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        .support-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .support-card { background: #1a1a2e; border-radius: 20px; padding: 25px; }
        .ticket-table { width: 100%; border-collapse: collapse; }
        .ticket-table th, .ticket-table td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .ticket-row { cursor: pointer; }
        .ticket-row:hover { background: rgba(255,255,255,0.03); }
        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
        }
        @media (max-width: 900px) { .support-layout { grid-template-columns: 1fr; } }
        
        /* Modal Styles */
        #ticketModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1a2e;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 25px;
            border: 1px solid rgba(99,102,241,0.3);
        }
        .message-admin {
            background: rgba(99,102,241,0.15);
            border-left: 3px solid #6366f1;
        }
        .message-user {
            background: rgba(255,255,255,0.05);
            border-left: 3px solid #ec4899;
        }
        .ticket-messages {
            margin: 15px 0;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            background: #0f0f1a;
            border-radius: 12px;
        }
        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 12px;
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .message-sender {
            font-weight: bold;
        }
        .message-time {
            font-size: 0.7rem;
            color: #94a3b8;
        }
        .message-text {
            font-size: 0.9rem;
            line-height: 1.5;
        }
        textarea {
            width: 100%;
            background: #0f0f1a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px;
            color: white;
            margin: 10px 0;
            resize: vertical;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .flex-buttons {
            display: flex;
            gap: 10px;
        }
        .flex-buttons button {
            flex: 1;
        }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <div class="logo" onclick="window.location.href='index.html'">🔥 360 Medya</div>
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
            <i class="fas fa-bars"></i>
        </button>
        <div class="nav-links" id="navLinks">
            <a href="index.html">Ana Sayfa</a>
            <a href="siparis.html">Yeni Sipariş</a>
            <a href="siparislerim.html">Siparişler</a>
            <a href="bakiye.html">Bakiye Yükle</a>
            <a href="destek.html">Destek</a>
            <a href="servisler.html">Servisler</a>
            <a href="ayarlar.html">Ayarlar</a>
            <a href="api.html">API</a>
            <a href="topluluk.html">Topluluk</a>
            <a href="referans.html">Referans</a>
        </div>
        <div class="right-area">
            <div class="balance-box" onclick="window.location.href='bakiye.html'">
                <i class="fas fa-coins"></i> <span id="userBalance">0.00</span> ₺
            </div>
            <div id="loginButton" class="auth-btn" onclick="openAuthModal()">
                <i class="fas fa-sign-in-alt"></i> Giriş Yap
            </div>
            <div id="logoutButton" class="auth-btn logout-btn" style="display:none;" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Çıkış
            </div>
        </div>
    </div>
</header>

<main>
    <h1 class="page-title"><i class="fas fa-headset"></i> Destek Talepleri</h1>
    <div class="support-layout">
        <div class="support-card">
            <h3>Yeni Destek Talebi</h3>
            <div class="form-group">
                <label>Konu</label>
                <select id="ticketCat">
                    <option value="">Seçin...</option>
                    <option value="siparis">Sipariş İşlemleri</option>
                    <option value="odeme">Ödeme Bildirimi</option>
                    <option value="diger">Diğer</option>
                </select>
            </div>
            <div class="form-group">
                <label>Başlık</label>
                <input type="text" id="ticketSubject" placeholder="Konu başlığı">
            </div>
            <div class="form-group">
                <label>Mesaj</label>
                <textarea id="ticketMessage" rows="4" placeholder="Detaylı açıklama..."></textarea>
            </div>
            <button class="btn-primary" onclick="createTicket()">Talebi Gönder</button>
        </div>
        <div class="support-card">
            <h3>Destek Geçmişim</h3>
            <div style="overflow-x:auto;">
                <table class="ticket-table">
                    <thead>
                        <tr><th>BAŞLIK</th><th>DURUM</th><th>TARİH</th></tr>
                    </thead>
                    <tbody id="ticketsList">
                        <tr><td colspan="3">Yükleniyor...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- TALEP DETAY MODALI -->
<div id="ticketModal">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 id="modalTicketTitle">Talep Detayı</h3>
            <i class="fas fa-times" style="font-size: 24px; cursor: pointer; color: #94a3b8;" onclick="closeTicketModal()"></i>
        </div>
        <div id="modalTicketStatus" style="margin-bottom: 15px; padding: 10px; background: #0f0f1a; border-radius: 12px;"></div>
        <div id="modalMessages" class="ticket-messages"></div>
        <textarea id="replyMessage" rows="3" placeholder="Cevabınızı yazın..."></textarea>
        <div class="flex-buttons">
            <button class="btn-primary" onclick="sendReply()">Cevapla</button>
            <button class="btn-secondary" onclick="closeTicketModal()">Kapat</button>
        </div>
    </div>
</div>

<!-- AUTH MODAL -->
<div id="authModal" class="auth-modal">
    <div class="auth-card">
        <div class="close-auth" onclick="closeAuthModal()">&times;</div>
        <h2 id="authTitle">Giriş Yap</h2>
        <button class="btn-google" onclick="googleLogin()">
            <img src="https://www.google.com/favicon.ico" style="width:18px;"> Google ile Devam Et
        </button>
        <div style="display:flex; align-items:center; margin:15px 0;">
            <hr style="flex:1;"><span>veya</span><hr style="flex:1;">
        </div>
        <input type="text" id="authEmail" class="auth-input" placeholder="E-posta">
        <input type="password" id="authPassword" class="auth-input" placeholder="Şifre">
        <button class="btn-primary" id="authActionBtn" onclick="authAction()">Giriş Yap</button>
        <p><a onclick="switchMode()" style="color:#6366f1; cursor:pointer;">Kayıt Ol</a></p>
    </div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyCtSpmTP9_i-s2ZL2rC1ozVx6uPu68kVCs",
        authDomain: "smm-panel-f2947.firebaseapp.com",
        databaseURL: "https://smm-panel-f2947-default-rtdb.firebaseio.com",
        projectId: "smm-panel-f2947",
        storageBucket: "smm-panel-f2947.firebasestorage.app",
        messagingSenderId: "758065772278",
        appId: "1:758065772278:web:a94d37b0ff892583e81ed7"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    
    let currentTicketId = null;
    
    // Auth State
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            document.getElementById('loginButton').style.display = 'none';
            document.getElementById('logoutButton').style.display = 'block';
            await loadTickets();
            await updateBalance();
        } else {
            document.getElementById('loginButton').style.display = 'block';
            document.getElementById('logoutButton').style.display = 'none';
            document.getElementById('userBalance').innerText = '0.00';
            document.getElementById('ticketsList').innerHTML = '<tr><td colspan="3">Giriş yapın</td></tr>';
        }
    });
    
    // Update Balance
    async function updateBalance() {
        const user = auth.currentUser;
        if (!user) return;
        const snapshot = await db.ref('users').once('value');
        const users = snapshot.val() || {};
        for (let key in users) {
            if (users[key].email === user.email) {
                document.getElementById('userBalance').innerText = (users[key].balance || 0).toFixed(2);
                break;
            }
        }
    }
    
    // Load Tickets
    async function loadTickets() {
        const user = auth.currentUser;
        if (!user) return;
        
        const snapshot = await db.ref('support_tickets').once('value');
        const tickets = snapshot.val() || {};
        
        const userTickets = [];
        for (let id in tickets) {
            if (tickets[id].userId === user.email) {
                userTickets.push({ firebaseId: id, ...tickets[id] });
            }
        }
        
        if (userTickets.length === 0) {
            document.getElementById('ticketsList').innerHTML = '<tr><td colspan="3">Henüz talep yok</td></tr>';
            return;
        }
        
        userTickets.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        
        document.getElementById('ticketsList').innerHTML = userTickets.map(t => `
            <tr class="ticket-row" onclick="openTicket('${t.firebaseId}')">
                <td><strong>${escapeHtml(t.subject)}</strong></td>
                <td><span class="order-status status-${t.status === 'open' ? 'pending' : 'completed'}">${t.status === 'open' ? 'Açık' : 'Çözüldü'}</span></td>
                <td>${new Date(t.createdAt).toLocaleDateString('tr-TR')}</td>
            </tr>
        `).join('');
    }
    
    // Create Ticket
    window.createTicket = async function() {
        const user = auth.currentUser;
        if (!user) {
            alert('Giriş yapın');
            openAuthModal();
            return;
        }
        
        const cat = document.getElementById('ticketCat').value;
        const subject = document.getElementById('ticketSubject').value.trim();
        const msg = document.getElementById('ticketMessage').value.trim();
        
        if (!cat || !subject || !msg) {
            alert('Tüm alanları doldurun');
            return;
        }
        
        const id = 'TCK-' + Date.now() + '-' + Math.random().toString(36).substring(2,6);
        const newTicket = {
            id: id,
            ticketId: id,
            userId: user.email,
            userName: user.displayName || user.email.split('@')[0],
            category: cat,
            subject: subject,
            status: 'open',
            createdAt: new Date().toISOString(),
            lastUpdated: new Date().toISOString(),
            messages: [{
                sender: 'user',
                senderName: user.displayName || user.email.split('@')[0],
                message: msg,
                timestamp: new Date().toISOString()
            }]
        };
        
        await db.ref('support_tickets').push(newTicket);
        alert('✅ Talep oluşturuldu!');
        document.getElementById('ticketCat').value = '';
        document.getElementById('ticketSubject').value = '';
        document.getElementById('ticketMessage').value = '';
        loadTickets();
    };
    
    // Open Ticket Modal
    window.openTicket = async function(ticketId) {
        const user = auth.currentUser;
        if (!user) return;
        
        const snapshot = await db.ref(`support_tickets/${ticketId}`).once('value');
        const ticket = snapshot.val();
        
        if (!ticket) {
            alert('Talep bulunamadı');
            return;
        }
        
        currentTicketId = ticketId;
        
        document.getElementById('modalTicketTitle').innerHTML = `<i class="fas fa-ticket-alt"></i> ${escapeHtml(ticket.subject)}`;
        document.getElementById('modalTicketStatus').innerHTML = `
            <strong>Durum:</strong> ${ticket.status === 'open' ? '🟡 Açık' : '✅ Çözüldü'} | 
            <strong>👤 ${escapeHtml(ticket.userName)}</strong>
        `;
        
        const messagesDiv = document.getElementById('modalMessages');
        messagesDiv.innerHTML = (ticket.messages || []).map(msg => `
            <div class="message ${msg.sender === 'admin' ? 'message-admin' : 'message-user'}">
                <div class="message-header">
                    <span class="message-sender">${escapeHtml(msg.senderName)} ${msg.sender === 'admin' ? '(Destek Ekibi)' : '(Siz)'}</span>
                    <span class="message-time">${new Date(msg.timestamp).toLocaleString('tr-TR')}</span>
                </div>
                <div class="message-text">${escapeHtml(msg.message).replace(/\n/g, '<br>')}</div>
            </div>
        `).join('');
        
        document.getElementById('replyMessage').value = '';
        document.getElementById('ticketModal').style.display = 'flex';
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    };
    
    // Send Reply
    window.sendReply = async function() {
        if (!currentTicketId) {
            alert('Talep bulunamadı');
            return;
        }
        
        const reply = document.getElementById('replyMessage').value.trim();
        if (!reply) {
            alert('Lütfen bir cevap yazın');
            return;
        }
        
        const user = auth.currentUser;
        if (!user) return;
        
        const snapshot = await db.ref(`support_tickets/${currentTicketId}`).once('value');
        const ticket = snapshot.val();
        
        const newMessage = {
            sender: 'user',
            senderName: user.displayName || user.email.split('@')[0],
            message: reply,
            timestamp: new Date().toISOString()
        };
        
        const messages = [...(ticket.messages || []), newMessage];
        
        await db.ref(`support_tickets/${currentTicketId}`).update({
            messages: messages,
            lastUpdated: new Date().toISOString(),
            status: 'open'
        });
        
        // Add message to modal
        const messagesDiv = document.getElementById('modalMessages');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message message-user';
        msgDiv.innerHTML = `
            <div class="message-header">
                <span class="message-sender">${escapeHtml(newMessage.senderName)} (Siz)</span>
                <span class="message-time">${new Date().toLocaleString('tr-TR')}</span>
            </div>
            <div class="message-text">${escapeHtml(reply).replace(/\n/g, '<br>')}</div>
        `;
        messagesDiv.appendChild(msgDiv);
        document.getElementById('replyMessage').value = '';
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        
        alert('✅ Cevabınız gönderildi!');
        loadTickets();
    };
    
    // Close Modal
    window.closeTicketModal = function() {
        document.getElementById('ticketModal').style.display = 'none';
        currentTicketId = null;
    };
    
    // Helper Functions
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    
    // Auth Modal Functions
    window.openAuthModal = function() {
        document.getElementById('authModal').classList.add('active');
    };
    window.closeAuthModal = function() {
        document.getElementById('authModal').classList.remove('active');
    };
    window.switchMode = function() {
        const isLogin = document.getElementById('authTitle').innerText === 'Giriş Yap';
        document.getElementById('authTitle').innerText = isLogin ? 'Kayıt Ol' : 'Giriş Yap';
        document.getElementById('authActionBtn').innerText = isLogin ? 'Kayıt Ol' : 'Giriş Yap';
    };
    window.authAction = async function() {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        const isLogin = document.getElementById('authTitle').innerText === 'Giriş Yap';
        
        if (isLogin) {
            await auth.signInWithEmailAndPassword(email, password);
        } else {
            await auth.createUserWithEmailAndPassword(email, password);
        }
        closeAuthModal();
    };
    window.googleLogin = function() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
        closeAuthModal();
    };
    window.logout = function() {
        auth.signOut();
    };
    window.toggleMobileMenu = function() {
        document.getElementById('navLinks').classList.toggle('show');
    };
    
    document.addEventListener('click', function(e) {
        const nav = document.getElementById('navLinks');
        const btn = document.querySelector('.mobile-menu-btn');
        if (nav && btn && window.innerWidth <= 768 && !nav.contains(e.target) && !btn.contains(e.target)) {
            nav.classList.remove('show');
        }
    });
</script>
</body>
</html>
